services:
  db:
    image: postgres:17-alpine
    container_name: animemind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: animemind
      POSTGRES_PASSWORD: animemind
      POSTGRES_DB: animemind
    ports:
      - '55432:5432'
    volumes:
      - animemind-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U animemind -d animemind']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  animemind-pgdata:
